<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#FFFFFF"/>

  <!-- .java -->
  <rect x="20" y="150" width="150" height="90" rx="8" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="95" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3B57">HelloUSG.java</text>
  <text x="95" y="210" text-anchor="middle" font-size="12" fill="#5A6B7B">kode sumber</text>
  <text x="95" y="226" text-anchor="middle" font-size="12" fill="#5A6B7B">dapat dibaca manusia</text>

  <line x1="170" y1="195" x2="260" y2="195" stroke="#1F3B57" stroke-width="2" marker-end="url(#p1)"/>
  <text x="215" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3B57">javac</text>

  <!-- .class -->
  <rect x="265" y="150" width="150" height="90" rx="8" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="340" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3B57">HelloUSG.class</text>
  <text x="340" y="210" text-anchor="middle" font-size="12" fill="#5A6B7B">bytecode</text>
  <text x="340" y="226" text-anchor="middle" font-size="12" fill="#5A6B7B">independen platform</text>

  <line x1="415" y1="195" x2="500" y2="195" stroke="#1F3B57" stroke-width="2" marker-end="url(#p1)"/>
  <text x="458" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3B57">dimuat oleh</text>

  <!-- JVM -->
  <rect x="505" y="130" width="190" height="130" rx="8" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="600" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A4A16">JVM</text>
  <text x="600" y="180" text-anchor="middle" font-size="11.5" fill="#7A4A16">(Java Virtual Machine)</text>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#5A6B7B">khusus tiap sistem operasi:</text>
  <text x="600" y="218" text-anchor="middle" font-size="11" fill="#5A6B7B">Windows, Linux, macOS</text>
  <text x="600" y="238" text-anchor="middle" font-size="11" fill="#5A6B7B">menerjemahkan bytecode</text>

  <line x1="695" y1="195" x2="780" y2="195" stroke="#1F3B57" stroke-width="2" marker-end="url(#p1)"/>
  <text x="738" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3B57">dieksekusi</text>

  <!-- output -->
  <rect x="785" y="150" width="195" height="90" rx="8" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="882" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#215E3A">Keluaran Program</text>
  <text x="882" y="200" text-anchor="middle" font-size="11" fill="#215E3A" font-family="Consolas, monospace">Selamat datang,</text>
  <text x="882" y="217" text-anchor="middle" font-size="11" fill="#215E3A" font-family="Consolas, monospace">mahasiswa PBO!</text>

  <!-- prinsip WORA -->
  <rect x="265" y="300" width="430" height="60" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="480" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#1F2A33">"Write Once, Run Anywhere": satu berkas .class</text>
  <text x="480" y="346" text-anchor="middle" font-size="13" font-style="italic" fill="#1F2A33">berjalan di JVM mana pun tanpa dikompilasi ulang.</text>

  <defs>
    <marker id="p1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1F3B57"/>
    </marker>
  </defs>
</svg>
