<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="950" height="500" fill="#FFFFFF"/>
  <text x="475" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">STRUKTUR HASHMAP: items.put(itemCode, item)</text>

  <rect x="40" y="60" width="230" height="50" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="155" y="90" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1F2A33">"B001".hashCode()</text>

  <line x1="270" y1="85" x2="340" y2="85" stroke="#1F3B57" stroke-width="2" marker-end="url(#ph)"/>
  <text x="305" y="72" text-anchor="middle" font-size="10.5" fill="#5A6B7B">%N</text>

  <text x="350" y="90" text-anchor="start" font-size="12" fill="#1F2A33">menentukan nomor bucket</text>

  <!-- baris bucket -->
  <text x="70" y="150" font-size="12" font-weight="bold" fill="#1F3B57">Bucket</text>
  <g font-size="11">
    <rect x="40" y="165" width="60" height="40" fill="#F4F6F7" stroke="#5A6B7B"/>
    <text x="70" y="189" text-anchor="middle">0</text>
    <rect x="100" y="165" width="60" height="40" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
    <text x="130" y="189" text-anchor="middle">1</text>
    <rect x="160" y="165" width="60" height="40" fill="#F4F6F7" stroke="#5A6B7B"/>
    <text x="190" y="189" text-anchor="middle">2</text>
    <rect x="220" y="165" width="60" height="40" fill="#F4F6F7" stroke="#5A6B7B"/>
    <text x="250" y="189" text-anchor="middle">3</text>
    <rect x="280" y="165" width="60" height="40" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
    <text x="310" y="189" text-anchor="middle">4</text>
    <rect x="340" y="165" width="60" height="40" fill="#F4F6F7" stroke="#5A6B7B"/>
    <text x="370" y="189" text-anchor="middle">...</text>
  </g>

  <line x1="130" y1="205" x2="130" y2="240" stroke="#2E6DA4" stroke-width="2"/>
  <rect x="50" y="240" width="160" height="50" rx="5" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.5"/>
  <text x="130" y="262" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#1F2A33">"B001" -&gt; Book</text>
  <text x="130" y="278" text-anchor="middle" font-size="10" fill="#5A6B7B">(Basis Data)</text>

  <line x1="310" y1="205" x2="310" y2="240" stroke="#2E6DA4" stroke-width="2"/>
  <rect x="230" y="240" width="160" height="50" rx="5" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.5"/>
  <text x="310" y="262" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#1F2A33">"J001" -&gt; Journal</text>
  <text x="310" y="278" text-anchor="middle" font-size="10" fill="#5A6B7B">(Jurnal SI)</text>

  <rect x="480" y="140" width="420" height="160" rx="8" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="690" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">Mengapa Pencarian Cepat?</text>
  <text x="500" y="190" font-size="12" fill="#1F2A33">Kunci "B001" langsung dihitung menuju</text>
  <text x="500" y="210" font-size="12" fill="#1F2A33">bucket tertentu memakai <tspan font-family="Consolas, monospace">hashCode()</tspan>,</text>
  <text x="500" y="230" font-size="12" fill="#1F2A33">bukan memeriksa satu per satu seperti</text>
  <text x="500" y="250" font-size="12" fill="#1F2A33">pencarian pada larik/List. Rata-rata</text>
  <text x="500" y="270" font-size="12" fill="#1F2A33"><tspan font-family="Consolas, monospace">get(kunci)</tspan> berjalan mendekati O(1).</text>

  <rect x="60" y="360" width="830" height="60" rx="6" fill="#FFF7F0" stroke="#D9822B" stroke-width="1.2"/>
  <text x="475" y="384" text-anchor="middle" font-size="12" font-style="italic" fill="#7A4A16">Dua kunci berbeda boleh jatuh ke bucket yang sama (tabrakan/collision);</text>
  <text x="475" y="402" text-anchor="middle" font-size="12" font-style="italic" fill="#7A4A16">Java menyimpannya sebagai daftar kecil di dalam bucket tersebut.</text>

  <defs>
    <marker id="ph" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1F3B57"/>
    </marker>
  </defs>
</svg>
