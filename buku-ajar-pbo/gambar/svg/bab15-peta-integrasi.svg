<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#FFFFFF"/>
  <text x="500" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">PETA INTEGRASI KONSEP OOP DALAM SIP-USG</text>

  <rect x="30" y="55" width="180" height="80" rx="8" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="120" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A33">Fondasi</text>
  <text x="120" y="92" text-anchor="middle" font-size="10" fill="#5A6B7B">Bab I-IV</text>
  <text x="120" y="107" text-anchor="middle" font-size="9.5" fill="#1F2A33">Objek, kelas,</text>
  <text x="120" y="120" text-anchor="middle" font-size="9.5" fill="#1F2A33">enkapsulasi, UML</text>

  <rect x="230" y="55" width="180" height="80" rx="8" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="320" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A33">Hierarki</text>
  <text x="320" y="92" text-anchor="middle" font-size="10" fill="#5A6B7B">Bab V-VII</text>
  <text x="320" y="107" text-anchor="middle" font-size="9.5" fill="#1F2A33">Pewarisan,</text>
  <text x="320" y="120" text-anchor="middle" font-size="9.5" fill="#1F2A33">polimorfisme, abstraksi</text>

  <rect x="430" y="55" width="180" height="80" rx="8" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="520" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A33">Ketahanan</text>
  <text x="520" y="92" text-anchor="middle" font-size="10" fill="#5A6B7B">Bab VIII-X</text>
  <text x="520" y="107" text-anchor="middle" font-size="9.5" fill="#1F2A33">Exception, koleksi/</text>
  <text x="520" y="120" text-anchor="middle" font-size="9.5" fill="#1F2A33">generic, file I/O</text>

  <rect x="630" y="55" width="180" height="80" rx="8" fill="#F3EAF7" stroke="#7A4E9E" stroke-width="2"/>
  <text x="720" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A33">Integrasi</text>
  <text x="720" y="92" text-anchor="middle" font-size="10" fill="#5A6B7B">Bab XI-XII</text>
  <text x="720" y="107" text-anchor="middle" font-size="9.5" fill="#1F2A33">JDBC (basis data)</text>
  <text x="720" y="120" text-anchor="middle" font-size="9.5" fill="#1F2A33">dan GUI Swing</text>

  <rect x="790" y="150" width="180" height="80" rx="8" fill="#FBE7E7" stroke="#B54444" stroke-width="2"/>
  <text x="880" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A33">Kualitas Desain</text>
  <text x="880" y="187" text-anchor="middle" font-size="10" fill="#5A6B7B">Bab XIII-XIV</text>
  <text x="880" y="202" text-anchor="middle" font-size="9.5" fill="#1F2A33">SOLID, Singleton,</text>
  <text x="880" y="215" text-anchor="middle" font-size="9.5" fill="#1F2A33">Factory, MVC</text>

  <line x1="120" y1="135" x2="330" y2="330" stroke="#B9C2CA" stroke-width="2"/>
  <line x1="320" y1="135" x2="380" y2="330" stroke="#B9C2CA" stroke-width="2"/>
  <line x1="520" y1="135" x2="470" y2="330" stroke="#B9C2CA" stroke-width="2"/>
  <line x1="720" y1="135" x2="540" y2="330" stroke="#B9C2CA" stroke-width="2"/>
  <line x1="880" y1="230" x2="600" y2="330" stroke="#B9C2CA" stroke-width="2"/>

  <rect x="280" y="330" width="440" height="110" rx="10" fill="#1F3B57"/>
  <text x="500" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">SIP-USG</text>
  <text x="500" y="385" text-anchor="middle" font-size="11" fill="#DCE6EF">Sistem Informasi Perpustakaan</text>
  <text x="500" y="403" text-anchor="middle" font-size="11" fill="#DCE6EF">terintegrasi: Model, View, Controller,</text>
  <text x="500" y="420" text-anchor="middle" font-size="11" fill="#DCE6EF">DAO/JDBC, dan design pattern</text>

  <line x1="500" y1="440" x2="500" y2="475" stroke="#1F3B57" stroke-width="2" marker-end="url(#pi)"/>

  <rect x="60" y="480" width="880" height="130" rx="8" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="500" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">Bab XV: Merakit dan Menyajikan Produk Utuh</text>
  <text x="90" y="535" font-size="11.5" fill="#1F2A33">Seluruh konsep di atas bukan bab-bab yang berdiri sendiri, melainkan lapisan-lapisan yang saling</text>
  <text x="90" y="555" font-size="11.5" fill="#1F2A33">menopang satu aplikasi yang sama, SIP-USG, sejak Bab II. Bab XV tidak memperkenalkan konsep</text>
  <text x="90" y="575" font-size="11.5" fill="#1F2A33">OOP baru; tugasnya adalah merakit seluruhnya menjadi satu produk yang dapat didemonstrasikan,</text>
  <text x="90" y="595" font-size="11.5" fill="#1F2A33">didokumentasikan, dan dipresentasikan sebagai proyek akhir kelompok (Tugas 4).</text>

  <defs>
    <marker id="pi" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3B57"/></marker>
  </defs>
</svg>
