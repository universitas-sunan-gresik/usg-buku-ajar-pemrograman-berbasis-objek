  <text x="475" y="532" text-anchor="middle" font-size="12" fill="#1F2A33"><tspan font-family="Consolas, monospace">finally</tspan> SELALU dijalankan, baik try berhasil, ditangkap catch, maupun tidak tertangkap sama sekali.</text>

  <defs>
