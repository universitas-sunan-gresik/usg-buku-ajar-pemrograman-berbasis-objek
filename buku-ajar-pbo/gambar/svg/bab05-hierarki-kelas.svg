<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">HIERARKI KELAS SIP-USG</text>

  <!-- superclass -->
  <rect x="330" y="55" width="340" height="150" fill="#1F3B57"/>
  <text x="500" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">LibraryItem</text>
  <line x1="330" y1="88" x2="670" y2="88" stroke="#FFFFFF" stroke-width="1"/>
  <text x="345" y="106" font-size="11.5" fill="#E7ECF1">- title : String</text>
  <text x="345" y="122" font-size="11.5" fill="#E7ECF1">- itemCode : String</text>
  <text x="345" y="138" font-size="11.5" fill="#E7ECF1">- available : boolean</text>
  <line x1="330" y1="148" x2="670" y2="148" stroke="#FFFFFF" stroke-width="1"/>
  <text x="345" y="166" font-size="11.5" fill="#E7ECF1">+ getSummary() : String</text>
  <text x="345" y="182" font-size="11.5" fill="#E7ECF1">+ displayInfo()</text>

  <!-- garis generalisasi -->
  <line x1="500" y1="205" x2="500" y2="260" stroke="#1F3B57" stroke-width="2"/>
  <line x1="180" y1="260" x2="820" y2="260" stroke="#1F3B57" stroke-width="2"/>
  <line x1="180" y1="260" x2="180" y2="300" stroke="#1F3B57" stroke-width="2"/>
  <line x1="500" y1="260" x2="500" y2="300" stroke="#1F3B57" stroke-width="2"/>
  <line x1="820" y1="260" x2="820" y2="300" stroke="#1F3B57" stroke-width="2"/>
  <path d="M485,205 L500,235 L515,205 Z" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>

  <!-- Book -->
  <rect x="30" y="300" width="300" height="170" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="180" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">Book</text>
  <line x1="30" y1="332" x2="330" y2="332" stroke="#2E6DA4" stroke-width="1"/>
  <text x="42" y="350" font-size="11" fill="#1F2A33">- author : String</text>
  <text x="42" y="366" font-size="11" fill="#1F2A33">- isbn : Isbn</text>
  <text x="42" y="382" font-size="11" fill="#1F2A33">- publicationYear : int</text>
  <line x1="30" y1="392" x2="330" y2="392" stroke="#2E6DA4" stroke-width="1"/>
  <text x="42" y="410" font-size="11" fill="#1F2A33">+ isPublishedAfter(int)</text>
  <text x="42" y="426" font-size="11" fill="#1F2A33">+ getSummary() : String</text>
  <text x="42" y="442" font-size="10.5" font-style="italic" fill="#5A6B7B">(override)</text>

  <!-- Journal -->
  <rect x="350" y="300" width="300" height="170" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="500" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">Journal</text>
  <line x1="350" y1="332" x2="650" y2="332" stroke="#D9822B" stroke-width="1"/>
  <text x="362" y="350" font-size="11" fill="#1F2A33">- publisher : String</text>
  <text x="362" y="366" font-size="11" fill="#1F2A33">- issueNumber : int</text>
  <line x1="350" y1="392" x2="650" y2="392" stroke="#D9822B" stroke-width="1"/>
  <text x="362" y="410" font-size="11" fill="#1F2A33">+ getSummary() : String</text>
  <text x="362" y="426" font-size="10.5" font-style="italic" fill="#5A6B7B">(override)</text>

  <!-- DigitalItem -->
  <rect x="670" y="300" width="300" height="170" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="820" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">DigitalItem</text>
  <line x1="670" y1="332" x2="970" y2="332" stroke="#3E8E5A" stroke-width="1"/>
  <text x="682" y="350" font-size="11" fill="#1F2A33">- format : String</text>
  <text x="682" y="366" font-size="11" fill="#1F2A33">- fileSizeMb : double</text>
  <line x1="670" y1="392" x2="970" y2="392" stroke="#3E8E5A" stroke-width="1"/>
  <text x="682" y="410" font-size="11" fill="#1F2A33">+ getSummary() : String</text>
  <text x="682" y="426" font-size="10.5" font-style="italic" fill="#5A6B7B">(override)</text>

  <rect x="60" y="490" width="880" height="55" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="500" y="512" text-anchor="middle" font-size="12.5" fill="#1F2A33">Panah segitiga kosong menunjuk ke superclass (generalisasi/pewarisan).</text>
  <text x="500" y="530" text-anchor="middle" font-size="12.5" fill="#1F2A33">Ketiga subclass mewarisi seluruh atribut dan method LibraryItem.</text>
</svg>
