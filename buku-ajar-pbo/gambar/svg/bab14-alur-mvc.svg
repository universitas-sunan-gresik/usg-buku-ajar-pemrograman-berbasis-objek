<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">ARSITEKTUR MVC PADA SIP-USG</text>

  <rect x="60" y="70" width="240" height="90" rx="8" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="180" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">View</text>
  <text x="180" y="115" text-anchor="middle" font-size="11" fill="#5A6B7B">id.ac.usg.sip.view</text>
  <text x="180" y="133" text-anchor="middle" font-size="10.5" fill="#5A6B7B">BookFormFrame (Swing)</text>

  <rect x="380" y="70" width="240" height="90" rx="8" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">Controller</text>
  <text x="500" y="115" text-anchor="middle" font-size="11" fill="#5A6B7B">id.ac.usg.sip.controller</text>
  <text x="500" y="133" text-anchor="middle" font-size="10.5" fill="#5A6B7B">BookController</text>

  <rect x="700" y="70" width="240" height="90" rx="8" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="820" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">Model</text>
  <text x="820" y="115" text-anchor="middle" font-size="11" fill="#5A6B7B">id.ac.usg.sip.model</text>
  <text x="820" y="133" text-anchor="middle" font-size="10.5" fill="#5A6B7B">Book, BookDAO, LibraryItem, ...</text>

  <line x1="300" y1="100" x2="380" y2="100" stroke="#1F3B57" stroke-width="2" marker-end="url(#pm)"/>
  <text x="340" y="88" text-anchor="middle" font-size="9.5" fill="#5A6B7B">1. aksi tombol</text>

  <line x1="620" y1="100" x2="700" y2="100" stroke="#1F3B57" stroke-width="2" marker-end="url(#pm)"/>
  <text x="660" y="88" text-anchor="middle" font-size="9.5" fill="#5A6B7B">2. panggil DAO</text>

  <line x1="700" y1="140" x2="620" y2="140" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#pm)"/>
  <text x="660" y="155" text-anchor="middle" font-size="9.5" fill="#5A6B7B">3. data Book</text>

  <line x1="380" y1="140" x2="300" y2="140" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#pm)"/>
  <text x="340" y="155" text-anchor="middle" font-size="9.5" fill="#5A6B7B">4. perbarui JTable</text>

  <rect x="60" y="220" width="880" height="200" rx="8" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="500" y="248" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2A33">Peran Setiap Lapisan pada MVC</text>
  <text x="90" y="275" font-size="12" fill="#1F2A33"><tspan font-weight="bold">View</tspan> (BookFormFrame) hanya mengurus tampilan: menampilkan komponen Swing</text>
  <text x="90" y="295" font-size="12" fill="#1F2A33">dan meneruskan aksi pengguna ke Controller, tanpa tahu detail JDBC sama sekali.</text>
  <text x="90" y="320" font-size="12" fill="#1F2A33"><tspan font-weight="bold">Controller</tspan> (BookController) menjembatani View dan Model: menerima</text>
  <text x="90" y="340" font-size="12" fill="#1F2A33">permintaan dari View, memanggil BookDAO, lalu mengembalikan hasilnya.</text>
  <text x="90" y="365" font-size="12" fill="#1F2A33"><tspan font-weight="bold">Model</tspan> (Book, BookDAO, LibraryItem, dan seluruh kelas domain) menyimpan</text>
  <text x="90" y="385" font-size="12" fill="#1F2A33">data dan aturan bisnis, tidak bergantung sama sekali pada View atau Controller.</text>

  <defs>
    <marker id="pm" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3B57"/></marker>
  </defs>
</svg>
