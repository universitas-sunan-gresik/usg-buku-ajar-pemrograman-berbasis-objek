<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 430" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="950" height="430" fill="#FFFFFF"/>

  <text x="150" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3B57">Kode Pemanggil</text>

  <rect x="30" y="150" width="240" height="60" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" font-size="12.5" fill="#1F2A33">b.setPublicationYear(2027)</text>
  <text x="150" y="193" text-anchor="middle" font-size="10.5" fill="#5A6B7B">(memanggil method publik)</text>

  <line x1="270" y1="180" x2="340" y2="180" stroke="#1F3B57" stroke-width="2" marker-end="url(#pk)"/>

  <!-- kotak hitam objek -->
  <rect x="345" y="70" width="300" height="290" rx="10" fill="#1F2A33"/>
  <text x="495" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">objek Book</text>

  <rect x="375" y="120" width="240" height="40" rx="4" fill="#3A4653"/>
  <text x="495" y="145" text-anchor="middle" font-size="11.5" fill="#F4F6F7">- title, - author (privat)</text>

  <rect x="375" y="170" width="240" height="40" rx="4" fill="#3A4653"/>
  <text x="495" y="195" text-anchor="middle" font-size="11.5" fill="#F4F6F7">- publicationYear (privat)</text>

  <rect x="375" y="220" width="240" height="40" rx="4" fill="#3A4653"/>
  <text x="495" y="245" text-anchor="middle" font-size="11.5" fill="#F4F6F7">validasi tahun di dalam setter</text>

  <text x="495" y="290" text-anchor="middle" font-size="20" fill="#D9822B">&#128274;</text>
  <text x="495" y="320" text-anchor="middle" font-size="11" fill="#C7CDD3">Tidak terlihat &amp; tidak</text>
  <text x="495" y="336" text-anchor="middle" font-size="11" fill="#C7CDD3">dapat diakses dari luar</text>

  <line x1="645" y1="180" x2="720" y2="180" stroke="#1F3B57" stroke-width="2" marker-end="url(#pk)"/>

  <rect x="725" y="150" width="200" height="60" rx="6" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="825" y="175" text-anchor="middle" font-size="12.5" fill="#1F2A33">Tahun tersimpan</text>
  <text x="825" y="193" text-anchor="middle" font-size="12.5" fill="#1F2A33">jika valid</text>

  <rect x="90" y="380" width="770" height="40" rx="6" fill="#FFF7F0" stroke="#D9822B" stroke-width="1.2"/>
  <text x="475" y="405" text-anchor="middle" font-size="12" font-style="italic" fill="#7A4A16">Pemanggil hanya perlu tahu "pintu masuk" publik; logika dan data di dalamnya tersembunyi.</text>

  <defs>
    <marker id="pk" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1F3B57"/>
    </marker>
  </defs>
</svg>
