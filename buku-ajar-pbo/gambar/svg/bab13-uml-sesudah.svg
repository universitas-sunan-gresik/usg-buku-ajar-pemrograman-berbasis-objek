  <rect x="360" y="55" width="230" height="90" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="475" y="77" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F2A33">LibraryService</text>
  <line x1="360" y1="87" x2="590" y2="87" stroke="#3E8E5A" stroke-width="1"/>
  <text x="372" y="105" font-size="10.5" fill="#1F2A33">- dao : BookDAO</text>
  <text x="372" y="120" font-size="10.5" fill="#1F2A33">- validator : LoanValidator</text>
  <text x="372" y="138" font-size="10" fill="#1F2A33">+ processLoan(code, nama)</text>

  <line x1="360" y1="100" x2="270" y2="180" stroke="#3E8E5A" stroke-width="1.5"/>
  <line x1="475" y1="145" x2="475" y2="180" stroke="#3E8E5A" stroke-width="1.5"/>
  <line x1="590" y1="100" x2="700" y2="180" stroke="#3E8E5A" stroke-width="1.5"/>

  <rect x="160" y="180" width="220" height="60" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="270" y="205" text-anchor="middle" font-size="12" fill="#1F2A33">LoanValidator</text>
  <text x="270" y="223" text-anchor="middle" font-size="10" fill="#5A6B7B">validate(item)</text>

  <rect x="400" y="180" width="150" height="60" rx="6" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="475" y="203" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1F2A33">&#171;interface&#187;</text>
  <text x="475" y="221" text-anchor="middle" font-size="12" fill="#1F2A33">BookDAO</text>

  <rect x="600" y="180" width="220" height="60" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="710" y="205" text-anchor="middle" font-size="12" fill="#1F2A33">LibraryItem</text>
  <text x="710" y="223" text-anchor="middle" font-size="10" fill="#5A6B7B">calculateFine() [abstrak]</text>

  <line x1="475" y1="240" x2="475" y2="270" stroke="#D9822B" stroke-width="1.5" stroke-dasharray="6,3"/>
  <path d="M460,255 L475,270 L490,255" fill="none" stroke="#D9822B" stroke-width="1.5"/>
  <rect x="380" y="278" width="190" height="42" rx="5" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="1.5"/>
  <text x="475" y="303" text-anchor="middle" font-size="11" fill="#1F2A33">BookDAOImpl (konkret)</text>

  <rect x="60" y="345" width="830" height="95" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
