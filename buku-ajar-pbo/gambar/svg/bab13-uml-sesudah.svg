  <text x="475" y="390" text-anchor="middle" font-size="12" fill="#1F2A33">OCP: denda memakai calculateFine() polimorfik, tanpa if/else jenis baru.</text>
  <text x="475" y="412" text-anchor="middle" font-size="12" fill="#1F2A33">DIP: LibraryService bergantung pada interface BookDAO, disuntik lewat constructor.</text>
