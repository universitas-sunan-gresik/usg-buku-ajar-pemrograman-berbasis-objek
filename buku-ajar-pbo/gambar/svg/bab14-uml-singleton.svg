<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">POLA SINGLETON: DatabaseConnection</text>

  <rect x="240" y="60" width="320" height="150" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">DatabaseConnection</text>
  <line x1="240" y1="92" x2="560" y2="92" stroke="#2E6DA4" stroke-width="1"/>
  <text x="252" y="112" font-size="11" fill="#1F2A33">- instance : DatabaseConnection</text>
  <text x="252" y="130" font-size="10.5" font-style="italic" fill="#5A6B7B">(static, satu-satunya salinan)</text>
  <line x1="240" y1="140" x2="560" y2="140" stroke="#2E6DA4" stroke-width="1"/>
  <text x="252" y="160" font-size="11" fill="#B54444">- DatabaseConnection()</text>
  <text x="252" y="178" font-size="10.5" fill="#5A6B7B">(constructor privat)</text>
  <text x="252" y="196" font-size="11" fill="#3E8E5A">+ getInstance() : DatabaseConnection</text>

  <path d="M400,210 C 300,240 300,270 400,290" fill="none" stroke="#1F3B57" stroke-width="2" marker-end="url(#ps)"/>
  <text x="280" y="255" font-size="11" fill="#5A6B7B">memanggil berulang</text>

  <rect x="290" y="295" width="220" height="50" rx="6" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="400" y="315" text-anchor="middle" font-size="11.5" fill="#1F2A33">getInstance() == getInstance()</text>
  <text x="400" y="333" text-anchor="middle" font-size="11" fill="#215E3A">selalu true</text>

  <defs>
    <marker id="ps" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3B57"/></marker>
  </defs>
</svg>
