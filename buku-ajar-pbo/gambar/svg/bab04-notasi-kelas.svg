<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">NOTASI DASAR KELAS UML</text>

  <rect x="300" y="60" width="300" height="220" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3B57">Book</text>
  <line x1="300" y1="105" x2="600" y2="105" stroke="#2E6DA4" stroke-width="1.2"/>
  <text x="315" y="128" font-size="13" fill="#1F2A33">- title : String</text>
  <text x="315" y="150" font-size="13" fill="#1F2A33">- isbn : Isbn</text>
  <text x="315" y="172" font-size="13" fill="#1F2A33">- publicationYear : int</text>
  <line x1="300" y1="185" x2="600" y2="185" stroke="#2E6DA4" stroke-width="1.2"/>
  <text x="315" y="208" font-size="13" fill="#1F2A33">+ getTitle() : String</text>
  <text x="315" y="230" font-size="13" fill="#1F2A33">+ setTitle(title : String)</text>
  <text x="315" y="252" font-size="13" fill="#1F2A33">+ getSummary() : String</text>

  <!-- callouts -->
  <line x1="300" y1="82" x2="160" y2="82" stroke="#5A6B7B" stroke-width="1"/>
  <text x="155" y="86" text-anchor="end" font-size="12" fill="#5A6B7B">1. Nama kelas</text>

  <line x1="300" y1="145" x2="160" y2="145" stroke="#5A6B7B" stroke-width="1"/>
  <text x="155" y="149" text-anchor="end" font-size="12" fill="#5A6B7B">2. Atribut</text>

  <line x1="300" y1="230" x2="160" y2="230" stroke="#5A6B7B" stroke-width="1"/>
  <text x="155" y="234" text-anchor="end" font-size="12" fill="#5A6B7B">3. Method</text>

  <line x1="600" y1="128" x2="760" y2="128" stroke="#5A6B7B" stroke-width="1"/>
  <text x="765" y="132" font-size="12" fill="#5A6B7B">"-" = private</text>

  <line x1="600" y1="208" x2="760" y2="208" stroke="#5A6B7B" stroke-width="1"/>
  <text x="765" y="212" font-size="12" fill="#5A6B7B">"+" = public</text>

  <rect x="130" y="330" width="640" height="120" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="150" y="355" font-size="13" font-weight="bold" fill="#1F2A33">Simbol visibilitas lain:</text>
  <text x="150" y="378" font-size="12.5" fill="#1F2A33">#  = protected (sepaket dan subclass)</text>
  <text x="150" y="400" font-size="12.5" fill="#1F2A33">~  = default/package-private (sepaket saja)</text>
  <text x="150" y="422" font-size="12.5" fill="#1F2A33">nama atribut/method statis digarisbawahi;</text>
  <text x="150" y="440" font-size="12.5" fill="#1F2A33">nama kelas/method abstrak dicetak miring.</text>
</svg>
