<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">DIAGRAM KELAS SIP-USG (SAMPAI BAB IV)</text>

  <!-- Catalog -->
  <rect x="40" y="70" width="220" height="110" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="150" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A33">Catalog</text>
  <line x1="40" y1="102" x2="260" y2="102" stroke="#3E8E5A" stroke-width="1"/>
  <text x="52" y="120" font-size="11.5" fill="#1F2A33">- catalogName : String</text>
  <text x="52" y="136" font-size="11.5" fill="#1F2A33">- books : Book[]</text>
  <line x1="40" y1="146" x2="260" y2="146" stroke="#3E8E5A" stroke-width="1"/>
  <text x="52" y="164" font-size="11.5" fill="#1F2A33">+ displayAll()</text>

  <!-- Book -->
  <rect x="390" y="70" width="220" height="150" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A33">Book</text>
  <line x1="390" y1="102" x2="610" y2="102" stroke="#2E6DA4" stroke-width="1"/>
  <text x="402" y="120" font-size="11.5" fill="#1F2A33">- title : String</text>
  <text x="402" y="136" font-size="11.5" fill="#1F2A33">- isbn : Isbn</text>
  <text x="402" y="152" font-size="11.5" fill="#1F2A33">- publicationYear : int</text>
  <line x1="390" y1="162" x2="610" y2="162" stroke="#2E6DA4" stroke-width="1"/>
  <text x="402" y="180" font-size="11.5" fill="#1F2A33">+ getSummary() : String</text>
  <text x="402" y="196" font-size="11.5" fill="#1F2A33">+ isPublishedAfter(int)</text>

  <!-- Isbn -->
  <rect x="700" y="90" width="180" height="90" fill="#FBE7E7" stroke="#B54444" stroke-width="2"/>
  <text x="790" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A33">Isbn</text>
  <line x1="700" y1="122" x2="880" y2="122" stroke="#B54444" stroke-width="1"/>
  <text x="712" y="140" font-size="11.5" fill="#1F2A33">- value : String</text>
  <line x1="700" y1="150" x2="880" y2="150" stroke="#B54444" stroke-width="1"/>
  <text x="712" y="168" font-size="11.5" fill="#1F2A33">+ getValue() : String</text>

  <!-- Member -->
  <rect x="40" y="480" width="220" height="130" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="150" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A33">Member</text>
  <line x1="40" y1="512" x2="260" y2="512" stroke="#2E6DA4" stroke-width="1"/>
  <text x="52" y="530" font-size="11.5" fill="#1F2A33">- memberId : String</text>
  <text x="52" y="546" font-size="11.5" fill="#1F2A33">- name : String</text>
  <text x="52" y="562" font-size="11.5" fill="#1F2A33">- maxLoan : int</text>
  <line x1="40" y1="572" x2="260" y2="572" stroke="#2E6DA4" stroke-width="1"/>
  <text x="52" y="590" font-size="11.5" fill="#1F2A33">+ canBorrow(int) : boolean</text>

  <!-- Loan -->
  <rect x="390" y="480" width="220" height="130" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="500" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A33">Loan</text>
  <line x1="390" y1="512" x2="610" y2="512" stroke="#D9822B" stroke-width="1"/>
  <text x="402" y="530" font-size="11.5" fill="#1F2A33">- member : Member</text>
  <text x="402" y="546" font-size="11.5" fill="#1F2A33">- book : Book</text>
  <text x="402" y="562" font-size="11.5" fill="#1F2A33">- loanDate : String</text>
  <line x1="390" y1="572" x2="610" y2="572" stroke="#D9822B" stroke-width="1"/>
  <text x="402" y="590" font-size="11.5" fill="#1F2A33">+ getSummary() : String</text>

  <!-- relasi: Catalog memiliki Book, agregasi -->
  <path d="M260,150 L285,140 L310,150 L285,160 Z" fill="#FFFFFF" stroke="#3E8E5A" stroke-width="2"/>
  <line x1="310" y1="150" x2="390" y2="150" stroke="#3E8E5A" stroke-width="2"/>
  <text x="270" y="115" font-size="12" fill="#3E8E5A">1</text>
  <text x="360" y="140" font-size="12" fill="#3E8E5A">0..*</text>

  <!-- relasi: Book memiliki Isbn, komposisi -->
  <path d="M610,125 L628,113 L646,125 L628,137 Z" fill="#B54444" stroke="#B54444" stroke-width="2"/>
  <line x1="646" y1="125" x2="700" y2="125" stroke="#B54444" stroke-width="2"/>
  <text x="618" y="105" font-size="12" fill="#B54444">1</text>
  <text x="660" y="115" font-size="12" fill="#B54444">1</text>

  <!-- relasi: Loan dan Member, asosiasi -->
  <line x1="260" y1="545" x2="390" y2="545" stroke="#1F3B57" stroke-width="2"/>
  <text x="272" y="538" font-size="12" fill="#1F3B57">1</text>
  <text x="360" y="538" font-size="12" fill="#1F3B57">0..*</text>

  <!-- relasi: Loan dan Book, asosiasi, garis melengkung -->
  <path d="M500,480 C 500,350 500,260 500,220" fill="none" stroke="#1F3B57" stroke-width="2"/>
  <text x="510" y="245" font-size="12" fill="#1F3B57">0..*</text>
  <text x="510" y="228" font-size="12" fill="#1F3B57">1</text>

  <rect x="40" y="650" width="840" height="55" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="460" y="672" text-anchor="middle" font-size="12" fill="#1F2A33">Diamond kosong = agregasi (Catalog-Book); diamond terisi = komposisi (Book-Isbn);</text>
  <text x="460" y="690" text-anchor="middle" font-size="12" fill="#1F2A33">garis polos = asosiasi (Loan-Member, Loan-Book). Hierarki pewarisan menyusul Bab V.</text>
</svg>
