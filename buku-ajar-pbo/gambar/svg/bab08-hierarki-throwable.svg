<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">HIERARKI THROWABLE</text>

  <rect x="400" y="55" width="200" height="46" rx="6" fill="#1F3B57"/>
  <text x="500" y="83" text-anchor="middle" font-size="13" fill="#FFFFFF">Throwable</text>

  <line x1="500" y1="101" x2="500" y2="130" stroke="#1F3B57" stroke-width="2"/>
  <line x1="230" y1="130" x2="740" y2="130" stroke="#1F3B57" stroke-width="2"/>
  <line x1="230" y1="130" x2="230" y2="155" stroke="#1F3B57" stroke-width="2"/>
  <line x1="740" y1="130" x2="740" y2="155" stroke="#1F3B57" stroke-width="2"/>

  <rect x="130" y="155" width="200" height="46" rx="6" fill="#FBE7E7" stroke="#B54444" stroke-width="2"/>
  <text x="230" y="183" text-anchor="middle" font-size="13" fill="#1F2A33">Error</text>

  <rect x="640" y="155" width="200" height="46" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="740" y="183" text-anchor="middle" font-size="13" fill="#1F2A33">Exception</text>

  <text x="230" y="225" text-anchor="middle" font-size="11" fill="#5A6B7B">OutOfMemoryError,</text>
  <text x="230" y="240" text-anchor="middle" font-size="11" fill="#5A6B7B">StackOverflowError</text>
  <text x="230" y="258" text-anchor="middle" font-size="10.5" font-style="italic" fill="#B54444">(di luar kendali program,</text>
  <text x="230" y="272" text-anchor="middle" font-size="10.5" font-style="italic" fill="#B54444">jangan ditangkap)</text>

  <line x1="740" y1="201" x2="740" y2="230" stroke="#2E6DA4" stroke-width="2"/>
  <line x1="580" y1="230" x2="900" y2="230" stroke="#2E6DA4" stroke-width="2"/>
  <line x1="580" y1="230" x2="580" y2="255" stroke="#2E6DA4" stroke-width="2"/>
  <line x1="900" y1="230" x2="900" y2="255" stroke="#2E6DA4" stroke-width="2"/>

  <rect x="480" y="255" width="200" height="60" rx="6" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="580" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A33">Checked Exception</text>
  <text x="580" y="296" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#1F2A33">BookNotAvailable-</text>
  <text x="580" y="309" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#1F2A33">Exception</text>

  <rect x="800" y="255" width="190" height="60" rx="6" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="895" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A33">RuntimeException</text>
  <text x="895" y="296" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#1F2A33">IllegalArgument-</text>
  <text x="895" y="309" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#1F2A33">Exception</text>

  <rect x="420" y="345" width="320" height="70" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="580" y="367" text-anchor="middle" font-size="11.5" fill="#1F2A33">Wajib ditangani (try-catch)</text>
  <text x="580" y="385" text-anchor="middle" font-size="11.5" fill="#1F2A33">atau dideklarasikan (throws),</text>
  <text x="580" y="403" text-anchor="middle" font-size="11.5" fill="#1F2A33">diperiksa saat kompilasi</text>

  <rect x="755" y="345" width="235" height="70" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="872" y="367" text-anchor="middle" font-size="11.5" fill="#1F2A33">Boleh tidak ditangani,</text>
  <text x="872" y="385" text-anchor="middle" font-size="11.5" fill="#1F2A33">biasanya menandakan</text>
  <text x="872" y="403" text-anchor="middle" font-size="11.5" fill="#1F2A33">kesalahan pemrograman</text>

  <rect x="60" y="450" width="880" height="120" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.5"/>
  <text x="500" y="478" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2A33">Pada SIP-USG</text>
  <text x="90" y="505" font-size="12" fill="#1F2A33"><tspan font-family="Consolas, monospace">BookNotAvailableException</tspan> meluas dari <tspan font-family="Consolas, monospace">Exception</tspan> (checked): kegagalan</text>
  <text x="90" y="525" font-size="12" fill="#1F2A33">meminjam adalah bagian normal alur bisnis yang wajib ditangani pemanggil.</text>
  <text x="90" y="550" font-size="12" fill="#1F2A33"><tspan font-family="Consolas, monospace">IllegalArgumentException</tspan> (Bab III) meluas dari <tspan font-family="Consolas, monospace">RuntimeException</tspan>: kesalahan pemrogram.</text>
</svg>
