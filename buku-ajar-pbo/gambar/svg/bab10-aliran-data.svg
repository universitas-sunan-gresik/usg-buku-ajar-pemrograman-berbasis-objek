<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">ALIRAN DATA JAVA: BYTE VS CHARACTER STREAM</text>

  <text x="250" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E6DA4">BYTE STREAM (biner)</text>
  <rect x="50" y="95" width="130" height="50" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="115" y="125" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1F2A33">objek Book</text>
  <text x="235" y="100" text-anchor="middle" font-size="9.5" fill="#5A6B7B">ObjectOutput-</text>
  <text x="235" y="112" text-anchor="middle" font-size="9.5" fill="#5A6B7B">Stream</text>
  <line x1="180" y1="120" x2="280" y2="120" stroke="#2E6DA4" stroke-width="2" marker-end="url(#pa)"/>
  <rect x="280" y="95" width="150" height="50" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="355" y="118" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1F2A33">katalog.dat</text>
  <text x="355" y="134" text-anchor="middle" font-size="9.5" fill="#5A6B7B">deretan byte 0/1</text>

  <text x="750" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E8E5A">CHARACTER STREAM (teks)</text>
  <rect x="560" y="95" width="150" height="50" rx="6" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="635" y="125" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1F2A33">List&lt;LibraryItem&gt;</text>
  <text x="765" y="106" text-anchor="middle" font-size="9.5" fill="#5A6B7B">Buffered-</text>
  <text x="765" y="118" text-anchor="middle" font-size="9.5" fill="#5A6B7B">Writer</text>
  <line x1="710" y1="120" x2="810" y2="120" stroke="#3E8E5A" stroke-width="2" marker-end="url(#pb)"/>
  <rect x="810" y="95" width="150" height="50" rx="6" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="885" y="118" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1F2A33">katalog.csv</text>
  <text x="885" y="134" text-anchor="middle" font-size="9.5" fill="#5A6B7B">teks terbaca manusia</text>

  <rect x="60" y="180" width="900" height="130" rx="8" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="500" y="205" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2A33">Kapan Memakai yang Mana?</text>
  <text x="90" y="230" font-size="12" fill="#1F2A33"><tspan font-weight="bold">Byte stream</tspan> (kelas berakhiran <tspan font-family="Consolas, monospace">...Stream</tspan>): data biner apa pun,</text>
  <text x="90" y="250" font-size="12" fill="#1F2A33">termasuk objek hasil serialisasi; tidak dimaksudkan dibaca manusia langsung.</text>
  <text x="90" y="275" font-size="12" fill="#1F2A33"><tspan font-weight="bold">Character stream</tspan> (kelas berakhiran <tspan font-family="Consolas, monospace">...Reader/...Writer</tspan>): teks yang</text>
  <text x="90" y="295" font-size="12" fill="#1F2A33">perlu dibaca atau diedit manusia, seperti berkas CSV pertukaran data.</text>

  <rect x="60" y="340" width="900" height="90" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.5"/>
  <text x="500" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A33">Pada SIP-USG</text>
  <text x="90" y="390" font-size="12" fill="#1F2A33"><tspan font-family="Consolas, monospace">CatalogFileUtil.saveItems()</tspan> memakai byte stream (serialisasi utuh objek),</text>
  <text x="90" y="410" font-size="12" fill="#1F2A33">sedangkan <tspan font-family="Consolas, monospace">exportTitlesCsv()</tspan> memakai character stream (pertukaran data sederhana).</text>

  <defs>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2E6DA4"/></marker>
    <marker id="pb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3E8E5A"/></marker>
  </defs>
</svg>
