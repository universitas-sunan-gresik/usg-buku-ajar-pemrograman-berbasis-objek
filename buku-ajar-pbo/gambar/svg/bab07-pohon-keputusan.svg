<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="950" height="560" fill="#FFFFFF"/>
  <text x="475" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">MEMILIH ABSTRACT CLASS ATAU INTERFACE</text>

  <rect x="345" y="55" width="260" height="55" rx="8" fill="#1F3B57"/>
  <text x="475" y="79" text-anchor="middle" font-size="12.5" fill="#FFFFFF">Apakah kelas-kelas berbagi</text>
  <text x="475" y="97" text-anchor="middle" font-size="12.5" fill="#FFFFFF">atribut atau kode implementasi?</text>

  <line x1="400" y1="110" x2="230" y2="170" stroke="#2E6DA4" stroke-width="2"/>
  <text x="280" y="150" font-size="12" fill="#2E6DA4">Ya</text>
  <line x1="550" y1="110" x2="720" y2="170" stroke="#D9822B" stroke-width="2"/>
  <text x="680" y="150" font-size="12" fill="#D9822B">Tidak</text>

  <rect x="100" y="170" width="260" height="70" rx="8" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="230" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F2A33">Gunakan Abstract Class</text>
  <text x="230" y="214" text-anchor="middle" font-size="11" fill="#1F2A33">contoh: LibraryItem</text>
  <text x="230" y="230" text-anchor="middle" font-size="11" fill="#1F2A33">(atribut + method terwujud bersama)</text>

  <rect x="590" y="170" width="260" height="70" rx="8" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="720" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F2A33">Lanjut ke pertanyaan berikut</text>
  <text x="720" y="214" text-anchor="middle" font-size="11" fill="#1F2A33">tentang sekadar "kontrak perilaku"</text>

  <line x1="720" y1="240" x2="720" y2="280" stroke="#D9822B" stroke-width="2"/>

  <rect x="590" y="280" width="260" height="60" rx="8" fill="#1F3B57"/>
  <text x="720" y="304" text-anchor="middle" font-size="12" fill="#FFFFFF">Apakah kelas tersebut perlu</text>
  <text x="720" y="322" text-anchor="middle" font-size="12" fill="#FFFFFF">"mewarisi" hal lain juga?</text>

  <line x1="660" y1="340" x2="560" y2="400" stroke="#3E8E5A" stroke-width="2"/>
  <text x="590" y="380" font-size="12" fill="#3E8E5A">Tidak</text>
  <line x1="790" y1="340" x2="850" y2="400" stroke="#B54444" stroke-width="2"/>
  <text x="810" y="380" font-size="12" fill="#B54444">Ya</text>

  <rect x="420" y="400" width="280" height="80" rx="8" fill="#EAF7EF" stroke="#3E8E5A" stroke-width="2"/>
  <text x="560" y="426" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F2A33">Gunakan Interface</text>
  <text x="560" y="444" text-anchor="middle" font-size="11" fill="#1F2A33">contoh: Borrowable, Printable</text>
  <text x="560" y="462" text-anchor="middle" font-size="11" fill="#1F2A33">(kelas boleh terwujud &gt;1 interface)</text>

  <rect x="720" y="400" width="200" height="80" rx="8" fill="#FBE7E7" stroke="#B54444" stroke-width="2"/>
  <text x="820" y="426" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F2A33">Interface tetap</text>
  <text x="820" y="444" text-anchor="middle" font-size="11" fill="#1F2A33">jadi pilihan, karena</text>
  <text x="820" y="462" text-anchor="middle" font-size="11" fill="#1F2A33">Java tak izinkan</text>
  <text x="820" y="476" text-anchor="middle" font-size="10.5" fill="#1F2A33">multiple inheritance kelas</text>

  <rect x="60" y="500" width="830" height="45" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="475" y="527" text-anchor="middle" font-size="12" fill="#1F2A33">Sebuah kelas hanya boleh extends satu superclass, tetapi boleh implements banyak interface sekaligus.</text>
</svg>
