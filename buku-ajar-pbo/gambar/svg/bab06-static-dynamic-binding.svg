<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3B57">PENGIKATAN STATIS VS DINAMIS</text>

  <!-- kiri: overloading -->
  <text x="250" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E6DA4">OVERLOADING = statis</text>
  <rect x="60" y="85" width="380" height="70" rx="6" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="250" y="112" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1F2A33">katalog.search(1)</text>
  <text x="250" y="132" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1F2A33">katalog.search("Jurnal SI")</text>

  <line x1="250" y1="155" x2="250" y2="195" stroke="#2E6DA4" stroke-width="2" marker-end="url(#pc)"/>
  <text x="330" y="180" font-size="11.5" fill="#5A6B7B">diputuskan KOMPILER</text>

  <rect x="60" y="205" width="380" height="80" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="250" y="228" text-anchor="middle" font-size="12" fill="#1F2A33">Dilihat dari TIPE ARGUMEN</text>
  <text x="250" y="246" text-anchor="middle" font-size="12" fill="#1F2A33">saat kode dikompilasi:</text>
  <text x="250" y="264" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1F2A33">search(int) / search(String)</text>

  <!-- kanan: overriding -->
  <text x="750" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#D9822B">OVERRIDING = dinamis</text>
  <rect x="560" y="85" width="380" height="70" rx="6" fill="#FFF7F0" stroke="#D9822B" stroke-width="2"/>
  <text x="750" y="118" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1F2A33">LibraryItem it = j1;</text>
  <text x="750" y="138" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#1F2A33">it.calculateFine(5)</text>

  <line x1="750" y1="155" x2="750" y2="195" stroke="#D9822B" stroke-width="2" marker-end="url(#po)"/>
  <text x="850" y="180" font-size="11.5" fill="#5A6B7B">diputuskan JVM</text>

  <rect x="560" y="205" width="380" height="80" rx="6" fill="#F4F6F7" stroke="#5A6B7B" stroke-width="1.2"/>
  <text x="750" y="228" text-anchor="middle" font-size="12" fill="#1F2A33">Dilihat dari TIPE OBJEK</text>
  <text x="750" y="246" text-anchor="middle" font-size="12" fill="#1F2A33">SEBENARNYA saat runtime:</text>
  <text x="750" y="264" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1F2A33">Journal.calculateFine()</text>

  <rect x="60" y="330" width="880" height="180" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.5"/>
  <text x="500" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2A33">Mengapa Disebut "Dinamis"?</text>
  <text x="90" y="390" font-size="12.5" fill="#1F2A33">Variabel <tspan font-family="Consolas, monospace">it</tspan> bertipe deklarasi <tspan font-family="Consolas, monospace">LibraryItem</tspan>,</text>
  <text x="90" y="412" font-size="12.5" fill="#1F2A33">tetapi objek yang sesungguhnya ditunjuknya adalah <tspan font-family="Consolas, monospace">Journal</tspan>.</text>
  <text x="90" y="434" font-size="12.5" fill="#1F2A33">JVM menelusuri tipe objek SEBENARNYA di heap saat</text>
  <text x="90" y="456" font-size="12.5" fill="#1F2A33"><tspan font-family="Consolas, monospace">calculateFine()</tspan> dipanggil, lalu menjalankan versi milik</text>
  <text x="90" y="478" font-size="12.5" fill="#1F2A33"><tspan font-family="Consolas, monospace">Journal</tspan>, bukan versi milik <tspan font-family="Consolas, monospace">LibraryItem</tspan> yang dideklarasikan.</text>

  <defs>
    <marker id="pc" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2E6DA4"/></marker>
    <marker id="po" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D9822B"/></marker>
  </defs>
</svg>
